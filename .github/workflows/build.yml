name: Build APKs

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install NDK and CMake
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;26.1.10909125" "cmake;3.22.1"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build editor + game APKs
        run: gradle assembleEditorDebug assembleGameDebug --no-daemon

      - name: Collect APKs
        run: |
          cp app/build/outputs/apk/editor/debug/app-editor-debug.apk 3gine-editor.apk
          cp app/build/outputs/apk/game/debug/app-game-debug.apk 3gine-game.apk

      - uses: actions/upload-artifact@v4
        with:
          name: 3gine-editor-apk
          path: 3gine-editor.apk

      - uses: actions/upload-artifact@v4
        with:
          name: 3gine-game-apk
          path: 3gine-game.apk

      - name: Publish release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            3gine-editor.apk
            3gine-game.apk
